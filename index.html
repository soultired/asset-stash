<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asset Stash</title>
<script src="manifest.js"></script>
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--ink:#16191d;--mut:#5d6773;--line:#e2e5ea;--acc:#2563eb;--acc-soft:#e8efff;
  --ok:#0f7a4a;--ok-bg:#e3f6ec;--warn:#9a5b00;--warn-bg:#fff1d6;--bad:#a4262c;--bad-bg:#fde7e8;--tile:#fff;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1318;--panel:#171c23;--ink:#e8ecf1;--mut:#97a2af;--line:#2a313b;--acc:#7aa2ff;--acc-soft:#1c2740;
  --ok:#6fd8a6;--ok-bg:#12281f;--warn:#f3c26b;--warn-bg:#2e2410;--bad:#ff9a9f;--bad-bg:#31161a;--tile:#f3f4f6;color-scheme:dark}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;padding:10px 16px}
header h1{font-size:16px;margin:0;white-space:nowrap}
#q{flex:1;min-width:0;max-width:420px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
#q:focus{outline:2px solid var(--acc);outline-offset:1px}
#count{color:var(--mut);font-size:13px;white-space:nowrap}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:0}
nav{position:sticky;top:53px;align-self:start;max-height:calc(100vh - 53px);overflow:auto;padding:12px 8px 24px 12px}
nav h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:14px 8px 4px}
nav button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:7px 10px;border:0;border-radius:8px;background:none;color:var(--ink);font:inherit;cursor:pointer}
nav button:hover{background:var(--acc-soft)}
nav button[aria-current=true]{background:var(--acc);color:#fff}
nav button span{opacity:.65;font-size:12px}
main{padding:16px 20px 60px;min-width:0}
.head{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.head h2{margin:0 0 4px;font-size:18px}
.head p{margin:4px 0 0;color:var(--mut);font-size:14px}
.head code{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12.5px}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;margin-right:6px}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-bad{background:var(--bad-bg);color:var(--bad)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.snds{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0;cursor:pointer;text-align:center;font:inherit;color:var(--ink);overflow:hidden}
.tile:hover{border-color:var(--acc)}
.tile .pic{display:grid;place-items:center;height:72px;background:var(--tile)}
.tile .pic img{width:40px;height:40px;object-fit:contain}
.grid.flags .pic img{width:64px;height:48px}
.tile .pic.bgp{height:90px;background-color:#fff}
.tile .nm{display:block;font-size:11.5px;color:var(--mut);padding:5px 6px 6px;overflow-wrap:anywhere;line-height:1.25}
.more{display:block;margin:16px auto 0;padding:9px 18px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
.toolbar input[type=text],.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
.toolbar input[type=text]{flex:1;min-width:220px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.card h3{margin:0 0 2px;font-size:15px}
.card .meta{color:var(--mut);font-size:13px;margin-bottom:8px}
.card .prev{font-size:26px;line-height:1.3;margin:6px 0 10px;overflow-wrap:anywhere}
.btn{padding:5px 11px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;cursor:pointer;margin-right:6px}
.btn:hover{border-color:var(--acc)}
a{color:var(--acc)}
.snd{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.snd .play{flex:1;text-align:left;border:0;background:none;color:var(--ink);font:inherit;font-size:13px;cursor:pointer;padding:4px}
.snd .play:hover{color:var(--acc)}
.snd .cp{font-size:12px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#16191d;color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;overflow-wrap:anywhere;z-index:20}
#toast.on{opacity:1;transform:translateX(-50%)}
.empty{color:var(--mut);padding:30px 0;text-align:center}
@media (max-width:760px){
  .layout{grid-template-columns:1fr}
  nav{position:static;max-height:none;display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-bottom:1px solid var(--line)}
  nav h2{display:none}
  nav button{width:auto;white-space:nowrap}
  main{padding:14px 12px 60px}
}
</style>
</head>
<body>
<header>
  <h1>Asset Stash</h1>
  <input id="q" type="search" placeholder="Tìm trong mục đang mở... (phím /)" aria-label="Tìm kiếm">
  <span id="count"></span>
</header>
<div class="layout">
  <nav id="nav" aria-label="Danh mục"></nav>
  <main id="main"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var S = window.STASH;
  if(!S){document.getElementById('main').textContent='Không tải được manifest.js';return;}
  var BATCH = 240;
  var sections = [];
  var add = function(arr, group, kind){ arr.forEach(function(d){ sections.push({id:d.id, group:group, title:d.title, kind:kind, d:d}); }); };
  add(S.icons,'Icons','img'); add(S.emoji,'Emoji','img'); add(S.brands,'Logo thương hiệu','img');
  add(S.flags,'Cờ','flag');
  var viCount = S.fonts.filter(function(f){ return f.vietnamese; }).length;
  sections.push({id:'fonts', group:'Font', title:'Font (' + viCount + ' có dấu tiếng Việt, ' + (S.fonts.length - viCount) + ' không)', kind:'fonts', d:{items:S.fonts}});
  add(S.sounds,'Âm thanh','sound'); add(S.backgrounds,'Nền','bg');
  sections.push({id:'retro', group:'CSS retro', title:'CSS retro', kind:'retro', d:{items:S.retro}});

  var cur = sections[0], limit = BATCH, loadedFonts = {};
  var $q = document.getElementById('q'), $main = document.getElementById('main'), $nav = document.getElementById('nav'), $count = document.getElementById('count'), $toast = document.getElementById('toast');
  var fontState = {text:'Xin chào! Tiếng Việt có dấu: ắ ằ ẳ ẵ ặ ơ ư đ ỳ ỹ — 0123456789', weight:400};
  var soundPack = Object.keys(S.sounds[0].packs)[0];
  var audio = null;

  function el(tag, props, kids){
    var e = document.createElement(tag);
    if(props) Object.keys(props).forEach(function(k){
      if(k==='class') e.className = props[k];
      else if(k==='text') e.textContent = props[k];
      else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2), props[k]);
      else e.setAttribute(k, props[k]);
    });
    (kids||[]).forEach(function(c){ if(c) e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
    return e;
  }
  function toast(msg){ $toast.textContent = msg; $toast.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function(){ $toast.classList.remove('on'); }, 1800); }
  function copy(text){
    var done = function(){ toast('Đã copy: ' + text); };
    if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(done, function(){ fallback(); }); }
    else fallback();
    function fallback(){ var t = el('textarea',{style:'position:fixed;opacity:0'}); t.value = text; document.body.appendChild(t); t.select(); try{document.execCommand('copy');}catch(e){} t.remove(); done(); }
  }
  function enc(p){ return encodeURI(p); }
  function licBadge(d){
    var b = el('span',{class:'badge ' + (d.attribution ? 'b-warn' : 'b-ok'), text: d.license + (d.attribution ? ' · cần ghi nguồn' : ' · không cần ghi nguồn')});
    return b;
  }
  function sectionCount(s){
    var d = s.d;
    if(s.kind==='fonts'||s.kind==='retro') return d.items.length;
    if(s.kind==='sound') return Object.keys(d.packs).reduce(function(n,k){return n+d.packs[k].length;},0);
    return d.names.length;
  }
  function buildNav(){
    $nav.textContent = '';
    var last = null;
    sections.forEach(function(s){
      if(s.group!==last){ $nav.appendChild(el('h2',{text:s.group})); last = s.group; }
      var b = el('button',{type:'button', 'aria-current': s===cur ? 'true':'false', onclick:function(){ cur = s; limit = BATCH; $q.value=''; render(); }},
        [el('div',{text:s.title.replace(/ \(.*/,'')}), el('span',{text:String(sectionCount(s))})]);
      $nav.appendChild(b);
    });
  }
  function head(s, extra){
    var d = s.d, h = el('div',{class:'head'});
    h.appendChild(el('h2',{text:s.title}));
    var line = el('p');
    if(d.license) line.appendChild(licBadge(d));
    if(d.note) line.appendChild(document.createTextNode(d.note));
    h.appendChild(line);
    if(d.dir) h.appendChild(el('p',{},[ 'Thư mục: ', el('code',{text:d.dir+'/'}), d.source ? el('span',{},[' · nguồn: ', el('a',{href:d.source, target:'_blank', rel:'noopener', text:d.source.replace(/^https?:\/\//,'')})]) : null ]));
    if(extra) h.appendChild(extra);
    return h;
  }
  function filterNames(names){
    var q = $q.value.trim().toLowerCase();
    return q ? names.filter(function(n){ return n.indexOf(q)>=0; }) : names;
  }
  function renderImgGrid(s, cls, srcDir, ext){
    var d = s.d, list = filterNames(d.names);
    $count.textContent = list.length + ' / ' + d.names.length;
    $main.appendChild(head(s));
    if(!list.length){ $main.appendChild(el('div',{class:'empty',text:'Không có kết quả'})); return; }
    var g = el('div',{class:'grid ' + (cls||'')});
    list.slice(0, limit).forEach(function(n){
      var path = srcDir + '/' + n + ext;
      g.appendChild(el('button',{class:'tile', type:'button', title:'Bấm để copy đường dẫn', onclick:function(){ copy(path); }},
        [el('span',{class:'pic'},[el('img',{src:enc(path), alt:n, loading:'lazy'})]), el('span',{class:'nm',text:n})]));
    });
    $main.appendChild(g);
    if(list.length > limit) $main.appendChild(el('button',{class:'more', type:'button', text:'Hiện thêm (' + (list.length-limit) + ' còn lại)', onclick:function(){ limit += BATCH; render(true); }}));
  }
  function renderFlags(s){
    var d = s.d, list = filterNames(d.names);
    $count.textContent = list.length + ' / ' + d.names.length;
    $main.appendChild(head(s));
    var g = el('div',{class:'grid flags wide'});
    list.slice(0, limit).forEach(function(n){
      var path = d.dir + '/' + n + '.svg';
      g.appendChild(el('button',{class:'tile', type:'button', title:'Bấm: copy đường dẫn · giữ Shift: copy class CSS', onclick:function(e){ copy(e.shiftKey ? 'fi fi-' + n : path); }},
        [el('span',{class:'pic'},[el('img',{src:enc(path), alt:n, loading:'lazy'})]), el('span',{class:'nm',text:n})]));
    });
    $main.appendChild(g);
    if(!list.length) $main.appendChild(el('div',{class:'empty',text:'Không có kết quả'}));
    if(list.length > limit) $main.appendChild(el('button',{class:'more', type:'button', text:'Hiện thêm', onclick:function(){ limit += BATCH; render(true); }}));
  }
  function loadFont(f){
    if(loadedFonts[f.id]) return; loadedFonts[f.id] = 1;
    document.head.appendChild(el('link',{rel:'stylesheet', href:f.css}));
  }
  function renderFonts(s){
    var q = $q.value.trim().toLowerCase();
    var items = s.d.items.filter(function(f){ return !q || f.title.toLowerCase().indexOf(q)>=0 || f.family.toLowerCase().indexOf(q)>=0; });
    $count.textContent = items.length + ' / ' + s.d.items.length;
    $main.appendChild(head(s));
    var txt = el('input',{type:'text', value:fontState.text, 'aria-label':'Chữ xem thử', oninput:function(e){ fontState.text = e.target.value; document.querySelectorAll('.prev').forEach(function(p){ p.textContent = fontState.text; }); }});
    var wv = el('span',{text:'Độ đậm ' + fontState.weight});
    var w = el('input',{type:'range', min:'300', max:'800', step:'100', value:String(fontState.weight), 'aria-label':'Độ đậm', oninput:function(e){ fontState.weight = +e.target.value; wv.textContent = 'Độ đậm ' + fontState.weight; document.querySelectorAll('.prev').forEach(function(p){ p.style.fontWeight = fontState.weight; }); }});
    $main.appendChild(el('div',{class:'toolbar'},[txt, w, wv]));
    items.forEach(function(f){
      loadFont(f);
      var badge = f.vietnamese ? el('span',{class:'badge b-ok', text:'Có dấu tiếng Việt'}) : el('span',{class:'badge b-bad', text:'KHÔNG có dấu tiếng Việt'});
      var prev = el('div',{class:'prev', text:fontState.text, style:"font-family:'" + f.family + "',sans-serif;font-weight:" + fontState.weight});
      var imp = "@import url('" + f.css + "');\nfont-family: '" + f.family + "', sans-serif;";
      $main.appendChild(el('div',{class:'card'},[
        el('h3',{text:f.title}),
        el('div',{class:'meta'},[badge, f.license + ' · ' + (f.variable ? 'variable ' : 'weights ') + f.weights.join(', ') + ' · ' + f.note]),
        prev,
        el('button',{class:'btn', type:'button', text:'Copy @import + font-family', onclick:function(){ copy(imp); }}),
        el('button',{class:'btn', type:'button', text:'Copy đường dẫn CSS', onclick:function(){ copy(f.css); }})
      ]));
    });
  }
  function renderSounds(s){
    var d = s.d, packNames = Object.keys(d.packs);
    var sel = el('select',{'aria-label':'Chọn phong cách', onchange:function(e){ soundPack = e.target.value; render(true); }},
      packNames.map(function(p){ var o = el('option',{value:p, text:p}); if(p===soundPack) o.selected = true; return o; }));
    $main.appendChild(head(s));
    $main.appendChild(el('div',{class:'toolbar'},[el('label',{text:'Phong cách: '},[sel]), el('span',{class:'meta',text:'Bấm tên để nghe, bấm "copy" để lấy đường dẫn'})]));
    var q = $q.value.trim().toLowerCase();
    var list = d.packs[soundPack].filter(function(n){ return !q || n.indexOf(q)>=0; });
    $count.textContent = list.length + ' / ' + d.packs[soundPack].length;
    var g = el('div',{class:'grid wide snds'});
    list.forEach(function(n){
      var path = d.dir + '/' + soundPack + '/' + n + '.mp3';
      g.appendChild(el('div',{class:'snd'},[
        el('button',{class:'play', type:'button', text:'▶ ' + n, onclick:function(){ if(audio){ audio.pause(); } audio = new Audio(enc(path)); audio.play().catch(function(){ toast('Không phát được file này'); }); }}),
        el('button',{class:'btn cp', type:'button', text:'copy', onclick:function(){ copy(path); }})
      ]));
    });
    $main.appendChild(g);
    if(!list.length) $main.appendChild(el('div',{class:'empty',text:'Không có kết quả'}));
  }
  function renderBg(s){
    var d = s.d, list = filterNames(d.names);
    $count.textContent = list.length + ' / ' + d.names.length;
    $main.appendChild(head(s));
    var g = el('div',{class:'grid wide'});
    list.forEach(function(n){
      var path = d.dir + '/' + n + '.svg';
      g.appendChild(el('button',{class:'tile', type:'button', title:'Bấm để copy đường dẫn', onclick:function(){ copy(path); }},
        [el('span',{class:'pic bgp', style:"background-image:url('" + enc(path) + "')"}), el('span',{class:'nm',text:n})]));
    });
    $main.appendChild(g);
    if(!list.length) $main.appendChild(el('div',{class:'empty',text:'Không có kết quả'}));
  }
  function renderRetro(s){
    var q = $q.value.trim().toLowerCase();
    var items = s.d.items.filter(function(r){ return !q || r.title.toLowerCase().indexOf(q)>=0; });
    $count.textContent = items.length + ' / ' + s.d.items.length;
    $main.appendChild(head(s));
    items.forEach(function(r){
      $main.appendChild(el('div',{class:'card'},[
        el('h3',{text:r.title}),
        el('div',{class:'meta'},[el('span',{class:'badge b-ok',text:r.license + ' · không cần ghi nguồn (giữ file LICENSE)'}), r.note]),
        r.demo ? el('a',{class:'btn', href:r.demo, target:'_blank', rel:'noopener', text:'Mở trang demo'}) : null,
        el('button',{class:'btn', type:'button', text:'Copy đường dẫn thư mục', onclick:function(){ copy(r.dir + '/'); }})
      ]));
    });
  }
  function render(keepScroll){
    var y = window.scrollY;
    $main.textContent = '';
    buildNav();
    if(cur.kind==='img'){
      var folder = cur.d.dir;
      renderImgGrid(cur, cur.group==='Emoji' ? '' : '', folder, '.svg');
    } else if(cur.kind==='flag') renderFlags(cur);
    else if(cur.kind==='fonts') renderFonts(cur);
    else if(cur.kind==='sound') renderSounds(cur);
    else if(cur.kind==='bg') renderBg(cur);
    else if(cur.kind==='retro') renderRetro(cur);
    if(keepScroll===true) window.scrollTo(0, y); else window.scrollTo(0, 0);
  }
  $q.addEventListener('input', function(){ limit = BATCH; render(true); });
  document.addEventListener('keydown', function(e){ if(e.key==='/' && document.activeElement!==$q && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){ e.preventDefault(); $q.focus(); } });
  render();
})();
</script>
</body>
</html>
